<app-navbar
  *ngIf="showChrome && auth.authReady()"
  [title]="navTitle"
  [subtitle]="navSubtitle"
  [showBack]="showBack"
  [showHistory]="showHistory"
  [showInfo]="showInfo"
  [showAnalytics]="showAnalytics"
  [showShoppingList]="showShoppingList"
  [showViewToggle]="showViewToggle"
  [viewMode]="currentViewMode()"
  [showSettings]="showSettings"
  [showProtocolSave]="showProtocolSave"
  [protocolSaving]="protocolBuilderState.saving()"
  [showSaveMeasure]="showSaveMeasure"
  [measureSaving]="measureState.saving()"
  (backClick)="onBack()"
  (historyClick)="onHistory()"
  (infoClick)="onInfo()"
  (analyticsClick)="onAnalytics()"
  (shoppingListClick)="onShoppingList()"
  (viewModeChange)="onViewModeChange($event)"
  (settingsClick)="onSettingsClick()"
  (saveDraftClick)="protocolBuilderState.requestSaveDraft()"
  (saveActivateClick)="protocolBuilderState.requestSaveActivate()"
  (saveMeasureClick)="measureState.requestSave()">
</app-navbar>

<div class="content" [class.no-chrome]="!showChrome"
  [appSwipeTabs]="swipeTabs" [swipeEnabled]="swipeEnabled">
  <div class="wrap">
    <router-outlet></router-outlet>
  </div>
</div>

<app-confirm-dialog></app-confirm-dialog>
<app-toast></app-toast>
<!-- TEMPORANEA: la sonda del viewport, finche' non si capisce perche' la
     tabbar si appoggia a altezze diverse fra una sezione e l'altra. -->
<app-viewport-probe *ngIf="showChrome && auth.authReady()"></app-viewport-probe>
<app-tabbar *ngIf="showChrome && auth.authReady() && !showRestBar"></app-tabbar>
<app-rest-bar *ngIf="showChrome && auth.authReady() && showRestBar"></app-rest-bar>
