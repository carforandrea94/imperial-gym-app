<!-- Sfumatura che spegne nel fondo il contenuto in arrivo sotto la barra.
     Sta qui e non nelle due <nav> perche' le tabbar sono due, cliente e
     coach: cosi' la condizione resta una sola e la sfumatura c'e' esattamente
     quando c'e' una barra. -->
<div class="tabfade" *ngIf="auth.authReady()"></div>

<!-- Tabbar CLIENT: Scheda / Dieta / Corsa / Misure / Account -->
<nav class="tabbar tabbar-5" *ngIf="!isCoach && auth.authReady()">
  <div class="pill"
    [class.p1]="activeTab === 'dieta'"
    [class.p2]="activeTab === 'corsa'"
    [class.p3]="activeTab === 'misure'"
    [class.p4]="activeTab === 'account'"></div>

  <button class="tabbtn" [class.active]="activeTab === 'scheda'" (click)="navigate('scheda')" aria-label="Scheda">
    <span class="ic">
      <!-- Manubrio a tratto: era l'unica icona piena della fila e a 21 px
           diventava una macchia accanto a quattro contorni. -->
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 9.5v5M7 6.5v11M17 6.5v11M20.5 9.5v5M7 12h10"/>
      </svg>
    </span>
  </button>

  <button class="tabbtn" [class.active]="activeTab === 'dieta'" (click)="navigate('dieta')" aria-label="Dieta">
    <span class="ic">
      <!-- Forchetta e coltello. Prima era un cerchio con un piu' dentro, che
           di questa sezione non diceva niente: leggeva "aggiungi". -->
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 3v5.5a2.5 2.5 0 0 0 5 0V3M9 9v12"/>
        <path d="M17.5 21V3c-1.9 1.4-2.8 3.5-2.8 5.8s.9 3.7 2.8 4.2"/>
      </svg>
    </span>
  </button>

  <button class="tabbtn" [class.active]="activeTab === 'corsa'" (click)="navigate('corsa')" aria-label="Corsa">
    <span class="ic">
      <!-- Scarpa da corsa vista di lato: leggibile a 21px, e non e' la solita
           sagoma di podista che a questa dimensione diventa una macchia. -->
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 16.5c0-1.1.5-2 1.6-2.4l3.6-1.3a3 3 0 0 0 1.4-1.1L11 8.2a1 1 0 0 1 1.6-.1l1 1.2c.5.6 1.1 1 1.9 1.3l4.1 1.4c1.5.5 2.4 1.6 2.4 3v1.9c0 .6-.4 1.1-1.1 1.1H3.1c-.6 0-1.1-.5-1.1-1.1z"/>
        <path d="M11.2 10.6l1.9 1.7M8.7 13l2 1.8M6 14.2l1.8 1.6"/>
      </svg>
    </span>
  </button>

  <button class="tabbtn" [class.active]="activeTab === 'misure'" (click)="navigate('misure')" aria-label="Misure">
    <span class="ic">
      <!-- Righello. Prima era una cornice con una riga in mezzo, cioe' il
           simbolo universale di "inquadra e scansiona". -->
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="8" width="19" height="8" rx="2"/>
        <path d="M7.5 8v3.2M12 8v4.2M16.5 8v3.2"/>
      </svg>
    </span>
  </button>

  <button class="tabbtn" [class.active]="activeTab === 'account'" (click)="navigate('account')" aria-label="Account">
    <span class="ic">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
    </span>
  </button>
</nav>

<!-- Tabbar COACH: Bacheca / Clienti / Account -->
<nav class="tabbar tabbar-3" *ngIf="isCoach && auth.authReady()">
  <div class="pill" [class.p1]="activeCoachTab === 'clienti'" [class.p2]="activeCoachTab === 'account'"></div>

  <button class="tabbtn" [class.active]="activeCoachTab === 'bacheca'" (click)="navigateCoach('bacheca')" aria-label="Bacheca">
    <span class="ic">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="16" height="16" rx="2"/>
        <path d="M8 9h8M8 13h5"/>
        <circle cx="17" cy="16" r="1.4" fill="currentColor" stroke="none"/>
      </svg>
    </span>
  </button>

  <button class="tabbtn" [class.active]="activeCoachTab === 'clienti'" (click)="navigateCoach('clienti')" aria-label="Clienti">
    <span class="ic">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="8" r="3.2"/>
        <path d="M3.5 20c0-3.6 2.9-6 5.5-6s5.5 2.4 5.5 6"/>
        <path d="M16 8.2a3 3 0 0 1 0 5.8M19.5 20c0-3-1.9-5.2-4-5.8"/>
      </svg>
    </span>
  </button>

  <button class="tabbtn" [class.active]="activeCoachTab === 'account'" (click)="navigateCoach('account')" aria-label="Account">
    <span class="ic">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
    </span>
  </button>
</nav>
