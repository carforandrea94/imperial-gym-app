<header class="navbar">
  <div class="inner">
    <button class="backbtn" [class.show]="showBack" (click)="backClick.emit()">
      <span class="chev">‹</span>
    </button>

    <div class="titleblock">
      <h1>{{ title }}</h1>
      <p class="navsubtitle">{{ subtitle }}</p>
    </div>

    <div class="navactions" [class.hide]="!showHistory && !showInfo && !showAnalytics && !showShoppingList && !showViewToggle && !showSettings && !showSaveEdit && !showProtocolSave && !showSaveMeasure">
      <div class="viewtoggle" *ngIf="showViewToggle">
        <button class="viewtogglebtn tap44 tap44-v" [class.active]="viewMode === 'list'" (click)="viewModeChange.emit('list')" aria-label="Vista elenco" title="Elenco">
          <lucide-icon name="list" [size]="16"></lucide-icon>
        </button>
        <button class="viewtogglebtn tap44 tap44-v" [class.active]="viewMode === 'slider'" (click)="viewModeChange.emit('slider')" aria-label="Vista slider" title="Slider">
          <lucide-icon name="gallery-horizontal" [size]="16"></lucide-icon>
        </button>
      </div>
      <button class="navicon" *ngIf="showSaveEdit" [disabled]="saveEditSaving"
        (click)="saveEditClick.emit()" aria-label="Salva modifiche" title="Salva modifiche">
        <lucide-icon name="check" [size]="18"></lucide-icon>
      </button>
      <button class="navicon" *ngIf="showSaveMeasure" [disabled]="measureSaving"
        (click)="saveMeasureClick.emit()" aria-label="Salva misurazione" title="Salva misurazione">
        <lucide-icon name="check" [size]="18"></lucide-icon>
      </button>
      <div class="protocolsave" *ngIf="showProtocolSave">
        <button class="navicon" [disabled]="protocolSaving" (click)="saveDraftClick.emit()"
          aria-label="Salva bozza" title="Salva bozza">
          <lucide-icon name="save" [size]="18"></lucide-icon>
        </button>
        <button class="navicon" [disabled]="protocolSaving" (click)="saveActivateClick.emit()"
          aria-label="Salva e attiva" title="Salva e attiva">
          <lucide-icon name="check" [size]="18"></lucide-icon>
        </button>
      </div>
      <button class="navicon" *ngIf="showShoppingList" (click)="shoppingListClick.emit()" title="Lista della spesa">
        <lucide-icon name="shopping-cart" [size]="18"></lucide-icon>
      </button>
      <button class="navicon" *ngIf="showAnalytics" (click)="analyticsClick.emit()" title="Andamento">
        <lucide-icon name="chart-line" [size]="18"></lucide-icon>
      </button>
      <button class="navicon" *ngIf="showHistory" (click)="historyClick.emit()" title="Storico">
        <lucide-icon name="history" [size]="18"></lucide-icon>
      </button>
      <button class="navicon" *ngIf="showInfo" (click)="infoClick.emit()" title="Info">
        <lucide-icon name="info" [size]="18"></lucide-icon>
      </button>
      <button class="navicon" *ngIf="showSettings" (click)="settingsClick.emit()" title="Aggiorna da PDF">
        <lucide-icon name="settings" [size]="18"></lucide-icon>
      </button>
    </div>
  </div>
</header>
