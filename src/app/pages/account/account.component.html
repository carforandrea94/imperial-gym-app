<div class="infocard account-header">
  <div class="badge account-avatar">{{ initial }}</div>
  <div class="info">
    <div class="lbl">{{ auth.currentUser()?.displayName }}</div>
    <div class="meta">{{ roleLabel }}</div>
  </div>
</div>

<app-forma-card *ngIf="!auth.isCoach"></app-forma-card>

<div class="infocard method-card" (click)="goToImpostazioni()">
  <div class="method-icon">
    <lucide-icon name="settings" [size]="24"></lucide-icon>
  </div>
  <div class="method-info">
    <div class="method-title">Impostazioni</div>
    <div class="method-sub">Tema, dati dell'account<ng-container *ngIf="auth.isCoach"> e codice coach</ng-container></div>
  </div>
  <span class="chev">
    <lucide-icon name="chevron-right" [size]="13"></lucide-icon>
  </span>
</div>

<div class="savebar">
  <button class="confirmbtn cancel w-full" (click)="logout()">Esci</button>
</div>
