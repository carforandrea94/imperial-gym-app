<div *ngIf="loading" class="history-empty">Caricamento…</div>

<div *ngIf="!loading && errorMsg" class="history-empty">
  {{ errorMsg }}<br>
  <button class="savebtn mt-3" (click)="load()">Riprova</button>
</div>

<ng-container *ngIf="!loading && !errorMsg">
  <!-- Quanta spesa manca. La barra sta in mezzo e si stringe da sola: prima
       qui c'era un tasto con flex:1, ereditato da .confirmbtn, che si prendeva
       tutta la riga e scorreva sopra il contatore. -->
  <div class="shop-top" *ngIf="totalCount > 0">
    <span class="shop-count">{{ checkedCount }} / {{ totalCount }}</span>
    <span class="shop-bar"><i [style.width.%]="progress"></i></span>
    <button class="shop-clear" (click)="resetAll()" *ngIf="checkedCount > 0">Svuota</button>
  </div>

  <div class="shop-addrow">
    <input type="text" [(ngModel)]="newItemName" (keydown.enter)="addCustomItem()" placeholder="Aggiungi alimento…">
    <button class="shop-addbtn" (click)="addCustomItem()">+</button>
  </div>

  <div *ngIf="totalCount === 0" class="history-empty">
    Nessun alimento trovato nei tuoi piani alimentari.<br>
    Aggiungi alimenti alla dieta per vederli qui, oppure aggiungine uno qui sopra.
  </div>

  <!-- I reparti. Dentro c'e' solo quello che manca: il preso scende nel
       carrello, in fondo. -->
  <ng-container *ngFor="let g of groups">
    <div class="shop-group" *ngIf="g.daPrendere.length > 0">
      <span class="shop-group-tit">{{ g.label }}</span>
      <span class="shop-group-n">{{ g.presi }} / {{ g.totale }}</span>
    </div>
    <div class="shop-list" *ngIf="g.daPrendere.length > 0">
      <button type="button" class="shop-row press-fx" *ngFor="let item of g.daPrendere" (click)="toggle(item)">
        <span class="shop-check"></span>
        <span class="shop-name">{{ item.name }}</span>
      </button>
    </div>
  </ng-container>

  <ng-container *ngIf="customDaPrendere.length > 0">
    <div class="shop-group">
      <span class="shop-group-tit">Aggiunti da te</span>
    </div>
    <div class="shop-list">
      <div class="shop-row press-fx" *ngFor="let item of customDaPrendere" (click)="toggleCustom(item)">
        <span class="shop-check"></span>
        <span class="shop-name">{{ item.name }}</span>
        <button class="delete-btn" (click)="removeCustom(item, $event)" title="Elimina">
          <lucide-icon name="trash-2" [size]="14"></lucide-icon>
        </button>
      </div>
    </div>
  </ng-container>

  <!-- Il carrello: quello che e' gia' dentro esce dalla lista, cosi' a meta'
       spesa si scorre quello che manca e non venti righe barrate. Si riapre
       per togliere una spunta sbagliata. -->
  <ng-container *ngIf="checkedCount > 0">
    <button type="button" class="shop-cart" [class.open]="cartOpen" (click)="toggleCart()"
      [attr.aria-expanded]="cartOpen">
      <lucide-icon name="chevron-down" [size]="14" class="shop-cart-chev"></lucide-icon>
      Nel carrello ({{ checkedCount }})
    </button>
    <div class="shop-list shop-list-cart" *ngIf="cartOpen">
      <button type="button" class="shop-row ok press-fx" *ngFor="let item of itemsPresi" (click)="toggle(item)">
        <span class="shop-check on">
          <lucide-icon name="check" [size]="13" [strokeWidth]="3"></lucide-icon>
        </span>
        <span class="shop-name">{{ item.name }}</span>
      </button>
      <div class="shop-row ok press-fx" *ngFor="let item of customPresi" (click)="toggleCustom(item)">
        <span class="shop-check on">
          <lucide-icon name="check" [size]="13" [strokeWidth]="3"></lucide-icon>
        </span>
        <span class="shop-name">{{ item.name }}</span>
        <button class="delete-btn" (click)="removeCustom(item, $event)" title="Elimina">
          <lucide-icon name="trash-2" [size]="14"></lucide-icon>
        </button>
      </div>
    </div>
  </ng-container>
</ng-container>
