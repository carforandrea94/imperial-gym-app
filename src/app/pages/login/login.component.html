<div class="authscreen">
  <div class="authcard infocard">
    <div class="authhead">
      <app-logo class="authlogo"></app-logo>
      <h1 class="authtitle">Imperial Gym</h1>
      <div class="authsub">Accedi al tuo account</div>
    </div>

    <form #f="ngForm" (ngSubmit)="submit(f)" novalidate>

      <div class="authfield">
        <label for="email">Email</label>
        <div class="measure-input-wrap">
          <!-- Senza autocapitalize la tastiera del telefono mette la maiuscola
               alla prima lettera, e l'indirizzo non e' piu' quello. -->
          <input id="email" type="email" inputmode="email" autocomplete="email"
            autocapitalize="none" autocorrect="off" spellcheck="false" name="email"
            [(ngModel)]="email" #emailCtrl="ngModel"
            required email placeholder="nome@esempio.com"
            [attr.aria-invalid]="emailCtrl.invalid && (emailCtrl.touched || f.submitted) ? 'true' : null"
            aria-describedby="email-err" />
        </div>
        <p class="fielderr" id="email-err" *ngIf="emailCtrl.invalid && (emailCtrl.touched || f.submitted)">
          <span *ngIf="emailCtrl.errors?.['required']">L'email e' obbligatoria.</span>
          <span *ngIf="emailCtrl.errors?.['email']">Email non valida.</span>
        </p>
      </div>

      <div class="authfield">
        <label for="password">Password</label>
        <div class="measure-input-wrap">
          <input id="password" [type]="showPassword ? 'text' : 'password'"
            autocomplete="current-password" name="password"
            [(ngModel)]="password" #passCtrl="ngModel"
            required placeholder="La tua password"
            [attr.aria-invalid]="passCtrl.invalid && (passCtrl.touched || f.submitted) ? 'true' : null"
            aria-describedby="pass-err" />
          <!-- Su una tastiera del telefono la password si sbaglia al buio, e
               poi non si capisce perche' l'accesso non va. -->
          <button type="button" class="pwtoggle" (click)="togglePassword()"
            [attr.aria-pressed]="showPassword"
            [attr.aria-label]="showPassword ? 'Nascondi la password' : 'Mostra la password'">
            <lucide-icon [name]="showPassword ? 'eye-off' : 'eye'" [size]="18"></lucide-icon>
          </button>
        </div>
        <p class="fielderr" id="pass-err" *ngIf="passCtrl.invalid && (passCtrl.touched || f.submitted)">
          <span *ngIf="passCtrl.errors?.['required']">La password e' obbligatoria.</span>
        </p>
      </div>

      <!-- role="alert" perche' un errore che compare va anche DETTO: senza,
           chi usa un lettore di schermo preme "Accedi" e non succede niente. -->
      <p class="autherror" role="alert" *ngIf="errorMsg">{{ errorMsg }}</p>
      <p class="authinfo" role="status" *ngIf="infoMsg">{{ infoMsg }}</p>

      <button class="savebtn" type="submit" [disabled]="loading">
        {{ loading ? 'Accesso in corso…' : 'Accedi' }}
      </button>

      <!-- Senza questo, una password dimenticata chiudeva fuori dall'app e
           basta: non c'era nessun modo di rientrare. -->
      <button type="button" class="authlink quiet" [disabled]="sendingReset" (click)="resetPassword()">
        {{ sendingReset ? 'Invio in corso…' : 'Password dimenticata?' }}
      </button>
    </form>

    <div class="authsep"><span>Non hai un account?</span></div>

    <a class="authlink" routerLink="/registrati">Crea il tuo account cliente</a>
    <a class="authlink" routerLink="/coach/registrati">Crea il tuo account coach</a>
  </div>
</div>
