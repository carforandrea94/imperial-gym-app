<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="Imperial Gym">
  <!-- Panca piana: il bilanciere sopra (acceso, e' il lavoro), la panca sotto
       (spenta, e' solo l'attrezzo). Tutto il disegno sta dentro il cerchio di
       raggio 40 centrato in 50,50 - la zona che Android non ritaglia quando
       l'icona e' dichiarata maskable. -->
  <rect width="100" height="100" fill="#0D0E10"/>
  <rect x="28" y="48" width="44" height="9" rx="4.5" fill="#5A6672"/>
  <g stroke="#5A6672" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M36 58 L30 73"/>
    <path d="M64 58 L70 73"/>
  </g>
  <g fill="#35C6F0">
    <rect x="20" y="25" width="60" height="8" rx="4"/>
    <rect x="27" y="20" width="6.5" height="18" rx="3.25"/>
    <rect x="66.5" y="20" width="6.5" height="18" rx="3.25"/>
  </g>
</svg>
